{% extends 'base.html' %}

{% block title %}
Users
{% endblock %}

{% block content %}

<h1>Users</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.0 }}</td>
        <td>{{ user.1 }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
