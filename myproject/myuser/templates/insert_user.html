{% extends 'base.html' %}

{% block title %}
Insert User
{% endblock %}

{% block content %}

<h1>Insert User</h1>

<form method="POST">
    {% csrf_token %}

    <label>Username:</label>
    <input type="text" name="username">

    <br><br>

    <label>Email:</label>
    <input type="email" name="email">

    <br><br>

    <label>Password:</label>
    <input type="password" name="password">

    <br><br>

    <button type="submit">Add User</button>
</form>

{% endblock %}
