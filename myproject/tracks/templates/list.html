{% extends 'base.html' %}

{% block title %}
Tracks
{% endblock %}

{% block content %}

<h1>Tracks</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Action</th>
    </tr>

    {% for track in tracks %}
    <tr>
        <td>{{ track.0 }}</td>
        <td>{{ track.1 }}</td>
        <td>
            <a href="#">Update</a>
            <a href="#">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
