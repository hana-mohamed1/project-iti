{% extends 'base.html' %}

{% block title %}
Insert Trainee
{% endblock %}

{% block content %}

<h1>Insert Trainee</h1>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name">

    <br><br>

    <label>Email:</label>
    <input type="email" name="email">

    <br><br>

    <label>Address:</label>
    <input type="text" name="address">

    <br><br>

    <button type="submit">Add Trainee</button>
</form>

{% endblock %}
